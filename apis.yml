aid: planning-center
url: https://raw.githubusercontent.com/api-evangelist/planning-center/refs/heads/main/apis.yml
name: Planning Center
kind: company
description: Planning Center is a suite of church management software products - People,
  Services, Giving, Groups, Check-Ins, Calendar, Registrations, and Publishing -
  used by churches to organize their people, plan worship services, process online
  giving, run small groups, manage attendance and check-in, schedule facilities and
  events, handle event registrations, and publish sermons. Each product exposes a
  documented public REST API under a shared base URL (https://api.planningcenteronline.com),
  authenticated with OAuth 2.0 or a Personal Access Token and returning data in the
  JSON:API 1.0 format. A Webhooks API delivers create/update/destroy events across
  the products. The APIs are free to use with a Planning Center account; each product
  is subscribed to separately.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup

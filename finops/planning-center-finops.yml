meters:
- name: product_subscription
  description: Monthly subscription for each active product, tiered by people count.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - product
  - people_count_tier
- name: giving_transactions
  description: Per-transaction processing fee on donations processed through Giving.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - fund
  - payment_source
- name: api_requests
  description: API calls made against the products; no charge, tracked for capacity/rate-limit visibility only.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - user
  - product
principles:
- name: Visibility
  description: Track which products are active and the account's people count, plus monthly Giving transaction volume - these drive the bill, not API usage.
- name: Allocation
  description: Attribute product subscriptions and Giving fees to ministries or campuses; API calls carry no cost to allocate.
- name: Optimization
  description: Deactivate unused products, keep the people database clean so people-count tiers are accurate, and consolidate donation processing to manage per-transaction fees.
- name: Accountability
  description: Review active product subscriptions and people-count tier at renewal; the free API means deeper integration does not increase spend.

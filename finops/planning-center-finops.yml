description: >-
  FinOps view of Planning Center spend. The API itself is free - there is no
  metered charge for API calls, tokens, or webhooks. Cost is driven by the product
  subscriptions the account carries. People is free. Services, Groups, Check-Ins,
  Calendar, Registrations, and Publishing are each a separate monthly subscription
  that scales by the number of people in the account. Giving carries no monthly
  software fee but charges a per-transaction processing fee on donations. Because
  most spend tracks people-count tiers and Giving transaction volume rather than
  API usage, cost management is about right-sizing which products are active and
  the account's people count, not about throttling API calls.
notes: >-
  Per-tier dollar amounts, people-count thresholds, and the Giving processing rate
  are not reconciled here; verify on the Planning Center pricing page. The API adds
  no incremental cost, so integrating more deeply does not raise the bill - only
  activating more products or growing people count / donation volume does.
